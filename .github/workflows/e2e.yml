name: E2E (Playwright)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    name: Landing journeys
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer block serves apps/web with `next start`, which
      # requires a production build. Build it here so the server has a real
      # `.next` directory on a clean checkout.
      - name: Build apps/web for the production server
        run: npm run build:web

      # The webServer block in playwright.config.js serves the built apps/web;
      # pointing E2E_BASE_URL elsewhere skips that local server.
      - name: Run E2E journeys against apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
