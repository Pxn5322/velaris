name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs checker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation consistency
        run: python3 scripts/check_docs.py --draft

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint all workspaces (oxlint for API, ESLint for web)
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails when a file drifts from .prettierrc. Fix with
      # `npm run format` (never by weakening the check).
      - name: Check Prettier formatting in all workspaces
        run: npm run format:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm install scripts are blocked in this environment, so the Prisma
      # client is never generated and @prisma/client exports no PrismaClient
      # until this runs. Generate before compiling (see SETUP_GUIDE).
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:ci-offline-check@localhost:5432/velaris
        run: npx prisma generate
      - name: Type-check all workspaces
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same Prisma client generation as the type-check and build jobs:
      # specs that load PrismaService require @prisma/client at runtime and
      # fail with "Cannot find module '.prisma/client/default'" without it.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:ci-offline-check@localhost:5432/velaris
        run: npx prisma generate
      - name: Run workspace unit tests
        run: npm run test
      # Boots the real AppModule. This is the check that caught the
      # type-only-import DI break in T1.02; the unit suite alone skips
      # *.e2e-spec.ts files.
      - name: Run API boot e2e spec
        run: npm run test:e2e --workspace apps/api

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same Prisma client generation as the type-check job: nest build runs
      # tsc, which needs the generated PrismaClient types.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:ci-offline-check@localhost:5432/velaris
        run: npx prisma generate
      # Fonts are self-hosted since D-25, so `next build` no longer downloads
      # from a font CDN; the retry keeps the job resilient to other transient
      # failures. Before D-25 the same step failed on
      # '@vercel/turbopack-next/internal/font/google/font' three times
      # (runs 41426929417, 41629476374, 41656114439). A real compile error
      # still fails all three attempts. Same pattern as e2e.yml.
      - name: Build all workspaces (nest build + next build)
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "build attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "build failed after 3 attempts"
          exit 1

  audit:
    name: Dependency audit (baseline gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails only on vulnerabilities beyond scripts/audit-baseline.json
      # (new package or severity increase). Known drift is recorded there
      # after owner review; new drift blocks the merge.
      - name: Fail on new npm audit vulnerabilities
        run: node scripts/check-audit-baseline.mjs

  inventory:
    name: Route inventory (authorization)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # NFR-02: every route must be authenticated and permission-scoped, or on
      # the documented public list in the script. It reads source only, so the
      # job needs no npm install and fails in seconds when a route is added
      # without a guard.
      - name: Check every route is guarded
        run: node scripts/check-route-inventory.mjs

  schema:
    name: Prisma schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      # The schema engine requires a --datasource argument even for schema-only
      # diffs. Without config.datasource.url the CLI omits it, swallows the
      # engine usage error, and exits 0 with empty output (7.10.1 bug seen
      # 2026-10-25). A dummy offline URL satisfies the engine; no connection
      # is made for --from-empty --to-schema.
      - name: Generate initial migration SQL (schema-only diff)
        env:
          DATABASE_URL: postgresql://postgres:ci-offline-check@localhost:5432/velaris
        run: |
          npx prisma migrate diff --from-empty --to-schema=prisma/schema.prisma --script > /tmp/init.sql
          if ! grep -q "CREATE TABLE" /tmp/init.sql; then
            echo "::error::migrate diff produced empty output"
            exit 1
          fi
          echo "migrate diff produced $(wc -l < /tmp/init.sql) lines"
