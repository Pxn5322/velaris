name: Merge gate

# Branch and approval gates from AGENTS.md sections 3.3 and 3.4.
#
# job 1  branch-workflow  rejects direct (non-merge) commits on master, so
#        every change arrives through its own branch (section 3.4 rule 5).
#        The bootstrap commit has no parent and is allowed.
#
# job 2  human-approval  rejects a pull request to master without a human
#        approval: the owner-approved label or an approving review from a
#        user other than the PR author. The script fails closed when it
#        cannot read reviews.
#
# GitHub branch protection (required reviews, required status checks) is a
# repository setting that files cannot enable. Enable it in Settings ->
# Branches for master and point it at these jobs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Re-run the gate when the owner-approved label changes. The default
    # pull_request types (opened, synchronize, reopened) miss labelling, so an
    # approval by label would leave the check red until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-workflow:
    name: No direct commits to master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject non-merge commits on master
        run: |
          PARENTS="$(git log -1 --format=%P)"
          COUNT="$(printf '%s' "$PARENTS" | wc -w)"
          echo "HEAD $(git log -1 --format='%h %s')"
          echo "parents: '$PARENTS' (count: $COUNT)"
          if [ "$COUNT" -eq 0 ]; then
            echo "Bootstrap commit - allowed by AGENTS.md 3.4 rule 5."
            exit 0
          fi
          if [ "$COUNT" -eq 1 ]; then
            echo "::error::Direct commit on master violates AGENTS.md 3.4. Merge the task branch with git merge --no-ff instead."
            exit 1
          fi
          echo "Merge commit - branch workflow satisfied."

  human-approval:
    name: Human approval required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run the gate code from the base branch. A pull request must not be
      # able to modify its own approval check.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require owner-approved label or approving review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pr-approval.mjs
