<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="velarisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="60" cy="60" r="55" stroke="url(#velarisGradient)" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Shield Shape -->
  <path d="M60 18 L95 30 L95 58 C95 78 78 95 60 102 C42 95 25 78 25 58 L25 30 Z" 
        fill="url(#shieldGradient)" 
        stroke="url(#velarisGradient)" 
        stroke-width="2.5"
        filter="url(#glow)"/>
  
  <!-- Neural Network Nodes (AI Intelligence) -->
  <!-- Top Node -->
  <circle cx="60" cy="38" r="5" fill="#6366F1" filter="url(#glow)">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Left Node -->
  <circle cx="42" cy="58" r="4" fill="#8B5CF6">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <!-- Right Node -->
  <circle cx="78" cy="58" r="4" fill="#06B6D4">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  
  <!-- Bottom Center Node -->
  <circle cx="60" cy="78" r="5" fill="#6366F1" filter="url(#glow)">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  
  <!-- Neural Connections -->
  <line x1="60" y1="38" x2="42" y2="58" stroke="#6366F1" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="38" x2="78" y2="58" stroke="#6366F1" stroke-width="1.5" opacity="0.6"/>
  <line x1="42" y1="58" x2="60" y2="78" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
  <line x1="78" y1="58" x2="60" y2="78" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Central Core (Operations Hub) -->
  <circle cx="60" cy="58" r="8" fill="#0F172A" stroke="url(#velarisGradient)" stroke-width="2"/>
  <circle cx="60" cy="58" r="4" fill="url(#velarisGradient)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Checkmark / Verification (Security) -->
  <path d="M53 58 L58 63 L68 52" 
        stroke="#10B981" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.5s" fill="freeze"/>
  </path>
</svg>
